name: CF Clearance Generator

on:
  workflow_dispatch:

jobs:
  generate-key:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: pip install nodriver curl_cffi

      - name: Install Chrome & Display Buffer
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Run Scraper
        # xvfb-run creates the 'screen' that config.headless = False requires
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Upload Data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results
          path: |
            result.json
            debug_page.html
