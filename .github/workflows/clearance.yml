name: CF Key Generator
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Libraries
        run: pip install nodriver curl_cffi

      - name: Install Chrome & Display Server
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb

      - name: Run Scraper
        # This command is the absolute requirement for running nodriver on a server
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python main.py

      - name: Upload Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results
          path: |
            result.json
            debug.html
